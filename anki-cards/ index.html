
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uniswap V3 Revision Cards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">SMART CONTRACT AUDIT STUDY</p>
      <h1>Uniswap V3</h1>
      <p class="subtitle">Liquidity & Tick Mechanics</p>
    </header>

    <section class="progress">
      <span id="counter">Card 1 of 20</span>
      <span id="knownCount">Known: 0</span>
    </section>

    <div class="progress-track">
      <div id="progressBar"></div>
    </div>

    <button class="flashcard" id="flashcard" aria-label="Reveal answer">
      <span class="card-label" id="cardLabel">QUESTION</span>
      <span class="card-number" id="cardNumber">01</span>
      <span class="card-content" id="cardContent"></span>
      <span class="card-hint" id="cardHint">Click to reveal answer ↗</span>
    </button>

    <div class="actions">
      <button class="secondary" id="prevBtn">← Previous</button>
      <button class="primary" id="revealBtn">Reveal Answer</button>
      <button class="secondary" id="nextBtn">Next →</button>
    </div>

    <div class="rating hidden" id="rating">
      <button class="missed" id="missedBtn">↻ Review Again</button>
      <button class="mastered" id="knownBtn">✓ I Know This</button>
    </div>

    <p class="keyboard-hint">Keyboard: Space = reveal · ← → = navigate</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
